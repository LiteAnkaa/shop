<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteAnka | Донат</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #000000, #1a0000);
            color: white;
        }

        header {
            padding: 50px 20px;
            text-align: center;
            background: #0d0d0d;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        h1 {
            font-size: 52px;
            margin: 0;
            color: #ff0000;
            text-shadow: 0 0 15px #ff0000;
        }

        .subtitle {
            font-size: 18px;
            opacity: 0.8;
        }

        .main-wrapper {
            display: flex;
            justify-content: space-between;
            padding: 50px;
            gap: 40px;
        }

        .donate-section, .case-section {
            width: 45%;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .row {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: #140000;
            border: 2px solid #ff0000;
            border-radius: 15px;
            padding: 25px;
            width: 200px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.9);
        }

        .case-card {
            background: #0f0f0f;
            border: 2px dashed #ff0000;
        }

        .divider {
            width: 3px;
            background: red;
            box-shadow: 0 0 20px red;
        }

        .title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ff3333;
        }

        .price {
            margin-bottom: 10px;
            font-weight: bold;
        }

        button {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: #ff0000;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #cc0000;
            box-shadow: 0 0 15px #ff0000;
        }

        footer {
            padding: 20px;
            text-align: center;
            opacity: 0.6;
        }

        @media (max-width: 900px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .divider {
                display: none;
            }
            .donate-section,
            .case-section {
                width: 100%;
            }
        }
    </style>

    <script>
        function buy(item) {
            const message = encodeURIComponent("Здравствуйте! Хочу купить: " + item + " | Сервер LiteAnka");
            window.location.href = "https://t.me/AmNem123gg?text=" + message;
        }
    </script>

</head>
<body>

<header>
    <h1>LiteAnka</h1>
    <p class="subtitle">Поддержи сервер и получи привилегии!</p>
</header>

<div class="main-wrapper">

    <!-- ДОНАТЫ -->
    <div class="donate-section">
        <div class="row">
            <div class="card">
                <div class="title">Lite</div>
                <div class="price">20₽</div>
                <button onclick="buy('Lite - 20₽')">Купить</button>
            </div>
            <div class="card">
                <div class="title">Pro</div>
                <div class="price">50₽</div>
                <button onclick="buy('Pro - 50₽')">Купить</button>
            </div>
            <div class="card">
                <div class="title">Ultra</div>
                <div class="price">100₽</div>
                <button onclick="buy('Ultra - 100₽')">Купить</button>
            </div>
        </div>

        <div class="row">
            <div class="card">
                <div class="title">Giper</div>
                <div class="price">350₽</div>
                <button onclick="buy('Giper - 350₽')">Купить</button>
            </div>
            <div class="card">
                <div class="title">Legasy</div>
                <div class="price">550₽</div>
                <button onclick="buy('Legasy - 550₽')">Купить</button>
            </div>
            <div class="card">
                <div class="title">King</div>
                <div class="price">777₽</div>
                <button onclick="buy('King - 777₽')">Купить</button>
            </div>
        </div>
    </div>

    <div class="divider"></div>

    <!-- КЕЙСЫ -->
    <div class="case-section">
        <div class="row">
            <div class="card case-card">
                <div class="title">Кейс с Донатом</div>
                <div class="price">50₽</div>
                <button onclick="buy('Кейс с Донатом - 50₽')">Открыть</button>
            </div>
            <div class="card case-card">
                <div class="title">Кейс с Монетами</div>
                <div class="price">25₽</div>
                <button onclick="buy('Кейс с Монетами - 25₽')">Открыть</button>
            </div>
            <div class="card case-card">
                <div class="title">Кейс с Префиксами</div>
                <div class="price">15₽</div>
                <button onclick="buy('Кейс с Префиксами - 15₽')">Открыть</button>
            </div>
        </div>

        <div class="row">
            <div class="card case-card">
                <div class="title">Кейс с Кирками</div>
                <div class="price">10₽</div>
                <button onclick="buy('Кейс с Кирками - 10₽')">Открыть</button>
            </div>
            <div class="card case-card">
                <div class="title">Кейс с Китами</div>
                <div class="price">35₽</div>
                <button onclick="buy('Кейс с Китами - 35₽')">Открыть</button>
            </div>
        </div>
    </div>

</div>

<footer>
    © 2026 LiteAnka Server | Все права защищены
</footer>

</body>
</html>
